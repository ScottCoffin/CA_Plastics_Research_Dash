# Region config for Norway (REG-1, Tier A, planned). Read by scripts/build_region_pages.py.
# Every candidate is a placeholder until a local collaborator confirms it: change its `status`
# to `confirmed` (or `draft` while in review) and keep the `note` short. Source list: docs/PLATFORM_ARCHITECTURE.md section 7.
# URLs are homepages only (never invented deep links). No URL here has been checked online yet.
schema_version: 1
slug: norway
name: Norway
iso: "NO"
tier: A
languages: [en, nb]
local_search_terms:
  - {term: "mikroplast", language: "nb", status: to_confirm, note: "Norwegian for microplastics; query term candidate"}
  - {term: "plastforurensning", language: "nb", status: to_confirm, note: "Norwegian for plastic pollution; query term candidate"}
  - {term: "marint søppel", language: "nb", status: to_confirm, note: "Norwegian for marine litter; query term candidate"}
  - {term: "nanoplast", language: "nb", status: to_confirm, note: "Norwegian for nanoplastics; query term candidate"}
sections:
  - id: funding
    title: Funding
    summary: Who pays for plastics research and monitoring in Norway.
    needs: A local collaborator to confirm which funders and programmes are relevant and to name any missing ones.
    items:
      - {name: "Research Council of Norway (Forskningsrådet)", url: "https://www.forskningsradet.no/", kind: funder, status: to_confirm, note: "URL not checked"}
      - {name: "Research Council of Norway project bank (Prosjektbanken)", url: "https://prosjektbanken.forskningsradet.no/", kind: funder, status: to_confirm, note: "URL not checked"}
      - {name: "EU CORDIS projects with Norwegian partners", url: "https://cordis.europa.eu/", kind: funder, status: to_confirm, note: "URL not checked; shared EU source"}
      - {name: "Handelens Miljøfond (retail environment fund)", url: "https://www.handelensmiljofond.no/", kind: funder, status: to_confirm, note: "URL not checked; a major plastics funder to confirm"}
  - id: monitoring
    title: Monitoring
    summary: Official programmes that measure litter and microplastics in Norwegian waters and on beaches and seabeds.
    needs: A local collaborator to confirm which monitoring programmes and datasets are open and usable.
    items:
      - {name: "Norwegian Environment Agency monitoring programmes", url: "https://www.miljodirektoratet.no/", kind: monitoring, status: to_confirm, note: "URL not checked"}
      - {name: "Vannmiljø (water environment database)", url: "", kind: monitoring, status: to_confirm, note: "No URL given; a collaborator to name the page"}
      - {name: "MOSJ (Svalbard and Norwegian marine monitoring)", url: "https://www.mosj.no/", kind: monitoring, status: to_confirm, note: "URL not checked"}
      - {name: "MAREANO seafloor litter", url: "https://www.mareano.no/", kind: monitoring, status: to_confirm, note: "URL not checked"}
      - {name: "OSPAR beach litter, Norwegian beaches", url: "https://www.ospar.org/", kind: monitoring, status: to_confirm, note: "URL not checked; shared OSPAR source"}
  - id: policy
    title: Policy
    summary: National and international rules and plans that shape plastics work in Norway.
    needs: A local collaborator to confirm the national plastics strategy and the dates of each item.
    items:
      - {name: "Norway's national plastics strategy", url: "", kind: policy, status: to_confirm, note: "No URL given; a collaborator to name the document"}
      - {name: "EU single-use plastics directive (EEA rules)", url: "", kind: policy, status: to_confirm, note: "No URL given; applies through the EEA agreement to confirm"}
      - {name: "EU REACH restriction on intentionally added microplastics", url: "", kind: policy, status: to_confirm, note: "No URL given; applies through the EEA agreement to confirm"}
      - {name: "UN plastics treaty negotiations", url: "", kind: policy, status: to_confirm, note: "No URL given; a collaborator to confirm the current status"}
  - id: research_networks
    title: Research networks
    summary: Institutes and networks that work on plastics and marine litter in Norway.
    needs: A local collaborator to confirm which institutes and networks to list, and to add any networks missing here.
    items:
      - {name: "NIVA (Norwegian Institute for Water Research)", url: "https://www.niva.no/", kind: institute, status: to_confirm, note: "URL not checked"}
      - {name: "NILU (Norwegian Institute for Air Research)", url: "https://www.nilu.no/", kind: institute, status: to_confirm, note: "URL not checked"}
      - {name: "SINTEF", url: "https://www.sintef.no/", kind: institute, status: to_confirm, note: "URL not checked"}
      - {name: "Akvaplan-niva", url: "https://www.akvaplan.niva.no/", kind: institute, status: to_confirm, note: "URL not checked"}
      - {name: "NORCE", url: "https://www.norceresearch.no/", kind: institute, status: to_confirm, note: "URL not checked"}
      - {name: "Institute of Marine Research (Havforskningsinstituttet)", url: "https://www.hi.no/", kind: institute, status: to_confirm, note: "URL not checked"}
  - id: local_terms
    title: Local search terms
    summary: Norwegian words used to search for plastics research beyond the English query.
    needs: A local collaborator to confirm each term and suggest more.
    items:
      - {name: "mikroplast", url: "", kind: search_term, status: to_confirm, note: "Candidate term; see local_search_terms"}
      - {name: "plastforurensning", url: "", kind: search_term, status: to_confirm, note: "Candidate term; see local_search_terms"}
      - {name: "marint søppel", url: "", kind: search_term, status: to_confirm, note: "Candidate term; see local_search_terms"}
      - {name: "nanoplast", url: "", kind: search_term, status: to_confirm, note: "Candidate term; see local_search_terms"}
  - id: geography
    title: Geography
    summary: The places the page covers - the mainland, Svalbard, and Norway's sea areas.
    needs: A local collaborator to confirm the boundaries used for regional views.
    items:
      - {name: "Kartverket (place names and boundaries)", url: "https://www.kartverket.no/", kind: geography, status: to_confirm, note: "URL not checked"}
      - {name: "Norwegian territorial waters and EEZ", url: "", kind: geography, status: to_confirm, note: "No URL given; a collaborator to name the boundary source"}
