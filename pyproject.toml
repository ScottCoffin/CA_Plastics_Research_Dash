[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-plastics-atlas"
version = "0.0.0"
description = "California plastics research, monitoring, and funding atlas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending owner confirmation" }
authors = [{ name = "Scott Coffin" }]
dependencies = [
  "defusedxml>=0.7.1",
  "duckdb==2.0.0",
  "pdfminer.six>=20231228",
  "geopandas>=1.0",
  "pyarrow>=17",
  "pyogrio>=0.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "shapely>=2.0",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=5",
  "scikit-learn>=1.5",
]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
