[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ca-plastics-atlas"
version = "0.0.0"
description = "California plastics research, monitoring, and funding atlas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License pending owner confirmation" }
authors = [{ name = "Scott Coffin" }]
dependencies = [
  "geopandas>=1.0",
  "pyarrow>=17",
  "pyogrio>=0.11",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
