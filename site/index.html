<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CA Plastics Research Atlas</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17324d;
        background: #eef6f7;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(42rem, calc(100% - 3rem));
        padding: 3rem;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 1rem 3rem rgb(23 50 77 / 12%);
      }
      h1 {
        margin-top: 0;
        line-height: 1.1;
      }
      p {
        line-height: 1.6;
      }
      .status {
        display: inline-block;
        padding: 0.35rem 0.7rem;
        border-radius: 999px;
        color: #075a46;
        background: #dff6ed;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">Bootstrap in progress</p>
      <h1>CA Plastics Research Atlas</h1>
      <p>
        This placeholder confirms that the static site deployment works. The public atlas of
        California plastic-related research, monitoring data, and funding will be built in later
        roadmap stages.
      </p>
    </main>
  </body>
</html>
