  - Boolean qualification or exclusion logic changes
  - the OpenAlex field scope changes
  cache_contract:
  - persist query_version and rendered query with cached counts
  - reject legacy flat caches and caches with a different query_version
  - percent-encode the complete filter value through the shared URL builder
provenance:
  supplied_by: lead agent (AT-1 revision)
  supplied_on: 2026-11-10
  evidence_status: derived from owner labels (354 works) and owner-named author recall probe
  details: docs/QUERY_AUDIT.md (AT-1 results and revision v3)
openalex:
  field: title_and_abstract.search
always_include:
- filter: raw_affiliation_strings.search:"Moore Institute for Plastic Pollution Research"
  reason: 'owner 2026-11-10: capture all Moore Institute publications (no OpenAlex institution record;
    most authorships carry no institution)'
- filter: raw_affiliation_strings.search:Algalita
  reason: Moore Institute predecessor name (Algalita Marine Research and Education)
# Owner rule 2026-11-11: "micro-nano plastics" in any spelling (micro-nano plastics,
# micro/nano plastics, micro(nano)plastics, micro- and nanoplastics, micronanoplastics)
# always makes a work plastic-related. Local labelling and export only; this is not part
# of the rendered OpenAlex query, so it does not change the query version. Export
# precedence: owner review-app decisions and AT-1/curation overrides still win; it beats
# the accepted model, Haiku and the keyword rule. Abstracts shared verbatim by 3+ works
# (OpenAlex mis-attachments) are ignored (atlas.nlp.labels.shared_abstract_ids).
always_relevant_patterns:
- '(?<![a-z])micro\s*(?:[-‐‑/(]\s*)?(?:and\s+|&\s*|or\s+)?\(?nano\)?\s*[-‐‑]?\s*plastics?(?![a-z])'
title_relevant_patterns:
# Lead 2026-11-13 (REL-1, docs/RELEVANCE_AUDIT_2026-11-13.md): title-only, high-precision phrases the
# query or the abstract rules miss. Each had 100% precision on the 1,909-work export; abstracts are not
# searched (noisy). Same precedence as always_relevant_patterns; owner review decisions still win.
- 'plastisphere|plastic[-\s]associated\s+(?:microb|microorganism|bacteri|biofilm|communit)'
- '(?<![a-z])(?:poly(?:styrene|propylene|ethylene(?! glycol)|vinyl chloride|ester)s?|PVC|PET|plastics?)\b[^.]{0,60}?(?:biodegrad|depolymeri[sz]|upcycl|methanolysis|glycolysis|pyrolysis|hydrothermal)'
- '(?:biodegrad|depolymeri[sz]|upcycl)\w*\s+(?:of\s+)?(?:\w+\s+){0,3}?(?:poly(?:styrene|propylene|ethylene(?! glycol)|vinyl chloride|ester)s?|PVC|plastics?)\b'
- 'plastics?\s+treaty|global\s+plastics?\s+(?:treaty|agreement)'
- '(?:abandoned|derelict),?\s+(?:lost|discarded)?[^.]{0,30}fishing\s+gear|ALDFG|ghost\s+(?:fishing|nets?)'
- 'cigarette\s+butts?'
- '\bty(?:re|res)\s+(?:wear\s+)?particles|\btires?\s+(?:wear\s+)?particles'
- 'agricultural\s+plastics?|plastic\s+(?:film\s+)?mulch'
relevance_policy:
  # Lead default 2026-11-13 (QUESTIONS REL-TIER2): chemicals-in-plastics is a plastic-related tier in the
  # labelling guide, so a pending low-confidence Haiku "false" does not drop a rule tier-2 hit.
  tier2_survives_low_confidence_false: true
exclude_types:
- erratum
- peer-review
- retraction
- paratext
notes: 'OpenAlex stems search terms: ''microplasticity'' matches ''microplastic'' and ''plastic'' matches
  ''plasticity'', so neither may be used as an exclusion or as a context word. Per-term contributions
  measured 2026-11-10 are in docs/QUERY_AUDIT.md.'
scope_note: 'Owner 2026-11-10: plastics LCA, recycling and alternatives are in scope, not only pollution.
  ''plastic products'' and ''plastic production'' were measured and left out (noise).'
promotion:
