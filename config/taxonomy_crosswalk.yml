# Taxonomy crosswalk (BQ-S5). PROPOSAL ONLY: no code, label, export, site file or
# config/taxonomy.yml behaviour reads or changes this file. Nothing ships until the owner
# approves each decision (A3-D7). Owner-facing summary: docs/TAXONOMY_PROPOSAL.md.
#
# Each entry: id, kind (topic_tag | tier | facet | facet_value | field), item (D1-D10 in
# docs/TAXONOMY_PROPOSAL.md), current_location (list), proposed_action (keep | rename |
# merge_into | split | add | add_experimental | defer), maps_to (list), source, notes,
# reporting (in_P1_P6 | excluded_from_P1_P6 | not_applicable), decision (always pending here).
version: taxonomy-crosswalk-v1
status: proposal
approval: A3-D7
owner_summary: docs/TAXONOMY_PROPOSAL.md
spec_sections: docs/add_on_spec_3.md §§5.4, 5.6, 5.10.3-5.10.6 (A3 §5.8 BQ-S5)
guide: docs/LABELING_GUIDE_A3_ADDENDUM.md (guide_v3, candidate)

# A3 §5.6 external schemes and the Atlas tags or facets they feed (as stated in A3 §5.6).
scheme_crosswalk:
  - scheme: "Zhang et al. (2020)"
    atlas_targets: [occurrence_and_monitoring, fate_transport_and_sorption, analytical_methods, ecotoxicology_and_trophic_transfer]
  - scheme: "Yang et al. (2023, soil)"
    atlas_targets: [analytical_methods, ecotoxicology_and_trophic_transfer, fate_transport_and_sorption, occurrence_and_monitoring]
    note: "Microbial-community effects are excluded from plastisphere by ADR-RELEVANCE-RULES (.agent/DECISIONS.md)."
  - scheme: "Wong et al. (2020)"
    atlas_targets: [ecotoxicology_and_trophic_transfer, human_exposure_and_health_risk]
  - scheme: "ToMEx (Hampton et al. 2025)"
    atlas_targets: [ecotoxicology_and_trophic_transfer, plastic_associated_chemicals]
  - scheme: "Seewoo et al. (2023)"
    atlas_targets: [plastic_associated_chemicals]
  - scheme: "Hartmann et al. (2019)"
    atlas_targets: [size_class (A2), origin (proposed facet), particle_shape (A3 §5.10.3)]
  - scheme: "Foellmer et al. (2022, WHO HEN 75)"
    atlas_targets: [behaviour_and_perception, policy_law_and_governance, analytic_lens responsibility_shifting]
  - scheme: "Zuanazzi et al. (2026)"
    atlas_targets: [review_type, environment_setting, polymer_type, particle_shape, model_organism_group, endpoint_technique]
  - scheme: "Özkan Vardar and Vardar (2026)"
    atlas_targets: [experimental_system, polymer_type, size_class (A2), particle_condition, endpoint_domain]
  - scheme: "Tran et al. (2026)"
    atlas_targets: [study_design, human_sample_matrix, organ_system, analytical_method, exposure_source]
  - scheme: "Barchiesi et al. (2026)"
    atlas_targets: [human_exposure_pathway, human_exposure_matrix]
  - scheme: "Zimmermann et al. (2025)"
    atlas_targets: [food_contact_article_type, size_definition_scheme, particle_shape]

