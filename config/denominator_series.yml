# Global-denominator series (BQ-2.1, BQ-2.2; A3 section 7 Module 2). Read by atlas.analytics.denominators.
#
# Ratio rules, enforced when the config loads and again when series are built:
# - A ratio is allowed only between two series that list each other in comparable_with AND
#   share the same counting_unit text (exact match) AND the same sensitivity. A mismatch raises.
# - beside_only series are shown next to a ratio, never divided. They must have an empty
#   comparable_with and must not appear in any other series' comparable_with.
# - status: available (computed now) | pending_fetch (needs a new OpenAlex fetch) |
#   waits_for (needs a named task first). Pending series are listed with their status, not computed.
# - compute denominator_cache reads one by-year entry from data/interim/denominator_series_cache.json,
#   written by scripts/fetch_denominator_series.py. cache_series names the fetched series; the entry
#   must match the active query version and filter digest.
# - sensitivity: all (every OpenAlex type) or article_review (type article or review only).
#
# Counting units: "OpenAlex records" = one OpenAlex work ID per record, by publication year,
# after the exclude_types filter. Retracted-flagged records stay in. Duplicates are not collapsed.
# "Curated works" = one row per work in the published site index, after owner labels and removals.

series:
  - id: A
    label: "Global plastics query v3.1 (all OpenAlex works matching the query, all types)"
    counting_unit: "OpenAlex records by publication year; exclude_types removed; duplicates not collapsed; retracted-flagged records included"
    source: "data/interim/denominator_series_cache.json (series A-all; scripts/fetch_denominator_series.py; one group_by publication_year request; query_version plastic-v3.1)"
    scope: global
    status: available
    compute: denominator_cache
    cache_series: A-all
    sensitivity: all
    comparable_with: [B, C]
    beside_only: false
    note: "Denominator for the California share and for B/A. Counts every OpenAlex record the query matches, minus the erratum, peer-review, retraction and paratext types. The same filter as the Evidence Map trend file (site/data/trend_global.json), but fetched in the same run as B, so B/A is one snapshot. A cannot exclude retracted articles: the group_by request has no retraction split, so the retracted column is null. The fetch can return future-dated records (2027), which the builder keeps and flags as partial."

  - id: A-article_review
    label: "Sensitivity: plastics query v3.1, OpenAlex types article and review only"
    counting_unit: "OpenAlex records of type article or review by publication year; exclude_types removed; duplicates not collapsed; retracted-flagged records included"
    source: "data/interim/denominator_series_cache.json (series A-article_review; scripts/fetch_denominator_series.py; adds type:article|review)"
    scope: global
    status: available
    compute: denominator_cache
    cache_series: A-article_review
    sensitivity: article_review
    comparable_with: [B-article_review]
    beside_only: false
    note: "Sensitivity series. OpenAlex document types are imprecise (Céspedes et al. 2025), so this shows how far the type restriction moves the share. Compared only with B-article_review, never with the all-types series."

  - id: B
    label: "Pollution-core v0 tier, global (A3 section 5.3 starting set; same count basis and exclusions as A)"
    counting_unit: "OpenAlex records by publication year; exclude_types removed; duplicates not collapsed; retracted-flagged records included"
    source: "data/interim/denominator_series_cache.json (series B-all; scripts/fetch_denominator_series.py; config/pollution_core_v0.yml core terms, the query's exclusions and exclude_types; no language filter)"
    scope: global
    status: available
    compute: denominator_cache
    cache_series: B-all
    sensitivity: all
    comparable_with: [A]
    beside_only: false
    note: "Pollution-core v0: the 29 A3 section 5.3 core terms (in queries.yml spelling). v0 omits the qualified context terms (microfiber, tire wear, litter) and the lifecycle terms (recycling, recycled plastic, single-use and biodegradable plastic, circular economy, LCA, bioplastics). Same count basis as A and the same exclusions, so B is a subset of A and B/A is a like-for-like share from one fetch run."

  - id: B-article_review
    label: "Sensitivity: pollution-core tier, OpenAlex types article and review only"
    counting_unit: "OpenAlex records of type article or review by publication year; exclude_types removed; duplicates not collapsed; retracted-flagged records included"
    source: "data/interim/denominator_series_cache.json (series B-article_review; scripts/fetch_denominator_series.py; pollution-core v0 terms, adds type:article|review)"
    scope: global
    status: available
    compute: denominator_cache
    cache_series: B-article_review
    sensitivity: article_review
    comparable_with: [A-article_review]
    beside_only: false
    note: "Sensitivity series for B. Compared only with A-article_review."

  - id: B2
    label: "Lifecycle-and-society hits with plastics_centrality primary or substantial, global"
    counting_unit: "OpenAlex records with a plastics_centrality label of primary or substantial, by publication year"
    source: "Not built. Needs the lifecycle-and-society candidate set (BQ-S3 yield and precision) and the labelled centrality field."
    scope: global
    status: waits_for
    waits_for: BQ-S3
    comparable_with: []
    beside_only: true
    note: "Kept separate from B. Its precision is estimated separately (A3 P4), so it is shown beside A and never divided until BQ-2.3 decides how to treat that precision."

  - id: C
    label: "California-connected records that the OpenAlex query matched"
    counting_unit: "OpenAlex records by publication year; exclude_types removed; duplicates not collapsed; retracted-flagged records included"
    source: "data/processed/normalized/works.parquet (ca_any_author) joined to data/interim/works_raw.parquet (source_run_id route: openalex-works, europepmc-audit, escholarship-ingest)"
    scope: california
    status: available
    compute: corpus_query_route
    comparable_with: [A]
    beside_only: false
    note: "OpenAlex records whose corpus work has ca_any_author and whose route applied the OpenAlex query: the query ingest (openalex-works-*), the Europe PMC audit (search AND DOI) and the eScholarship audit (location AND query). Duplicate records are counted, so the unit matches A. ORCID and ROR DOI-route records are left out: they used a local text rule, not the OpenAlex query. Moore Institute scope records are fetched without the query term and sit inside the query ingest route; stored fields cannot tell them apart, so C can slightly overstate query-matched output."

  - id: D
    label: "Published plastic-related works, California (site index)"
    counting_unit: "curated published works by publication year; one row per work; owner labels and curation removals applied"
    source: "site/data/index.json (works with plastic_related true); is_retracted joined from data/processed/normalized/works.parquet"
    scope: california
    status: available
    compute: published_plastic_related
    comparable_with: []
    beside_only: true
    note: "Owner-labelled plastic-related works that are published. Different unit from A and C (curated, one row per work), so it is shown beside them and never divided. Retracted works are counted in their own column."
