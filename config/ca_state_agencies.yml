# California state bodies that have no OpenAlex institution record (S1.2-AGENCIES, 2026-11-11).
#
# normalize matches `patterns` (case-insensitive regular expressions) against each
# raw-affiliation string of an authorship. A match adds the synthetic `id` to the
# authorship and removes the umbrella records OpenAlex linked instead (CalEPA
# I65137940 and "State of California" I4389425283), so one body is never counted twice.
# Keep patterns strict: a false positive moves a work to the wrong agency.
#
# Regional Water Quality Control Boards use `region_pattern` + `region_number`, which
# expand to "<region> ... water board", "water board ... <region>" and "water board, region N".
#
# To add an agency: append an entry with a stable id (CAAG-<SHORT>), its HQ location, the
# parent OpenAlex id, and patterns; then run scripts/normalize_openalex.py. Agencies that
# do have an OpenAlex record (CDPH, DTSC, CARB, OPC, ...) belong in the registry, not here.
agencies:
  - id: CAAG-OEHHA
    name: Office of Environmental Health Hazard Assessment
    short_name: OEHHA
    atlas_type: state-agency
    parent_id: I65137940
    parent_name: California Environmental Protection Agency
    city: Sacramento
    region: California
    lat: 38.5767
    lon: -121.4937
    patterns:
      - 'office of environmental health (and )?hazard assessment'
      - '\boehha\b'
  - id: CAAG-SWRCB
    name: State Water Resources Control Board
    short_name: State Water Board
    atlas_type: state-agency
    parent_id: I65137940
    parent_name: California Environmental Protection Agency
    city: Sacramento
    region: California
    lat: 38.5767
    lon: -121.4937
    patterns:
      - 'state water resources control board'
      - 'state water (quality control )?board'
      - '\bswrcb\b'
      - 'california water boards?\b'
      - 'division of drinking water.{0,80}(sacramento|california)'
      - '(sacramento|california).{0,80}division of drinking water'
  - id: CAAG-RWQCB1
    name: North Coast Regional Water Quality Control Board
    short_name: North Coast Water Board
    atlas_type: state-agency
    parent_id: I65137940
    parent_name: California Environmental Protection Agency
    city: Santa Rosa
    region: California
    lat: 38.4404
    lon: -122.7144
    region_pattern: 'north coast'
    region_number: 1
