# Link-out registry (Add-on A2 §8, EM-16).
# Principles: link, don't mirror; deepest verified link only; static and contextual;
# no claims beyond what the steward says; terms recorded per entry; weekly HTTP status
# check only. Nothing listed here is ingested, mirrored or scraped.
# Unknown fields are "not stated". The Minderoo Plastic Health Map is intentionally absent.
# trigger_rules: "topic=<tag>" shows the entry in the Evidence Map strip when that topic is
# selected; "default" shows it when no topic-specific entry matches (owner question EM5-STRIP).
# last_checked stays null here; the weekly check records it in docs/api_notes/linkouts_check.json.
schema_version: 1
entries:
  - id: "LO-1"
    name: "Global Plastic Laws"
    steward: "managed by Plastic Pollution Coalition, with key partners Break Free From Plastic Europe, Environmental Law Alliance Worldwide, and Surfrider Foundation U.S."
    description: "plastic legislation that has been passed around the world"
    description_source: "https://www.globalplasticlaws.org/about"
    relation: "law database"
    update_model: "not stated"
    terms_status: "recorded"
    terms: "Global Plastic Laws. All rights reserved."
    reuse_mode: "link_only"
    root_url: "https://www.globalplasticlaws.org/"
    url_status: "as_stated"
    verified_topic_slugs:
      - "design-reuse"
      - "microplastics"
      - "reduction"
      - "maritime-sources"
      - "waste-management"
      - "extended-producer-responsibility"
    deep_link_templates:
      - template: "/search?search={q}"
        evidence_url: "https://www.globalplasticlaws.org/"
      - template: "/map"
        evidence_url: "https://www.globalplasticlaws.org/"
      - template: "/topic/{slug}"
        evidence_url: "https://www.globalplasticlaws.org/"
      - template: "/law?lawId={id}"
        evidence_url: "https://www.globalplasticlaws.org/"
    trigger_rules:
      - "default"
      - "weekly HTTP status check only"
    last_checked: null

