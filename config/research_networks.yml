# Research networks and consortia registry (NET-1, owner request 2026-11-15).
# Principles follow the link-out registry (config/linkouts.yml): link, don't mirror; text is
# quoted as the steward states it; nothing is fetched or scraped from the linked pages.
# The full contributor roster is NOT copied here: only the Atlas expert IDs of listed
# contributors (to link their Atlas profiles) and the roster size. Most contributors have no
# Atlas profile yet (no plastic-related publications so far, owner 2026-11-15); they appear
# automatically once their work enters the corpus, if their ID is added below.
# host_institution_ids get the full card on /institution; member_institution_ids (employers of
# listed contributors, per the steward page) get a one-line pointer to the host.
# Rebuild the public JSON with `py -3.14 scripts/build_research_networks_json.py`.
schema_version: 1
networks:
  - id: "NET-1"
    name: "Land to Sea Microplastics Consortium"
    # The steward page title and breadcrumb use "Microplastics"; its on-page heading reads
    # "Land to Sea Microplastic Consortium". The title form is used (QUESTIONS NET-1-NAME).
    name_variants:
      - "Land to Sea Microplastic Consortium"
    url: "https://marinescience.ucdavis.edu/microplastics-consortium-source-solution"
    url_status: "owner_confirmed"  # owner supplied the saved page, 2026-11-15
    steward: "Coastal and Marine Sciences Institute, UC Davis"
    steward_source: "https://marinescience.ucdavis.edu/about"
    description: "We aim to bring together experts from leading institutions to advance a One-Health understanding of microplastics, as well as even-smaller nano-plastics."
