<!doctype html>
<!--
  BQ-V.0 benchmark page (synthetic graph, offline).
  Loads sigma 3.0.3 and graphology 0.26.0 from the Observable npm cache that the
  site build already uses (framework/src/.observablehq/cache/_npm). The runner
  serves that folder under /npm/ on 127.0.0.1. No network access is needed.
  Driven by scripts/bench/bq_v0_sigma_bench.py through window.benchApi.run(cfg).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>BQ-V.0 Sigma.js benchmark (synthetic graph)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
  </style>
  <script type="importmap">
    {"imports": {
      "sigma": "/npm/sigma@3.0.3/_esm.js",
      "graphology": "/npm/graphology@0.26.0/_esm.js"
    }}
  </script>
</head>
<body>
  <div id="stage"></div>
  <script type="module">
    import Sigma from "sigma";
    import Graph from "graphology";

    // Renderer settings copied from framework/src/components/network.js (createRenderer).
    const SIGMA_SETTINGS = {
      renderEdgeLabels: false,
      labelDensity: 0.07,
      labelGridCellSize: 70,
      labelRenderedSizeThreshold: 8,
      minCameraRatio: 0.02,
      maxCameraRatio: 5
    };

    const CLUSTERS = 50;        // community count
    const INTRA_SHARE = 0.9;    // share of edges that stay inside a cluster
    const MEAN_DEGREE = 6;      // average degree (edges = n * 3)
    const PATH_RATIO_CENTRE = 1;

    // Seeded PRNG (mulberry32): same seed gives the same graph in every run.
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function next() {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // Binary search on a cumulative weight array; returns an index.
    function sampleIndex(cum, rnd) {
      const target = rnd() * cum[cum.length - 1];
      let lo = 0;
      let hi = cum.length - 1;
      while (lo < hi) {
        const mid = (lo + hi) >>> 1;
        if (cum[mid] > target) hi = mid;
        else lo = mid + 1;
      }
      return lo;
    }

    // Synthetic graph: random preset positions, 50 clusters with 90% intra-cluster
    // edges, Pareto-like node weights so degrees are skewed (hubs exist).
    function makeSyntheticGraph(n, seed) {
      const rnd = mulberry32(seed);
      const cluster = new Uint16Array(n);
      const x = new Float32Array(n);
      const y = new Float32Array(n);
      const weight = new Float64Array(n);
      const cumAll = new Float64Array(n);
      let total = 0;
      for (let i = 0; i < n; i++) {
        cluster[i] = Math.floor(rnd() * CLUSTERS);
        x[i] = rnd() * 1000;
        y[i] = rnd() * 1000;
        weight[i] = Math.pow(1 - rnd(), -0.6);
        total += weight[i];
        cumAll[i] = total;
      }
      const members = Array.from({length: CLUSTERS}, () => []);
      for (let i = 0; i < n; i++) members[cluster[i]].push(i);
      const cumCluster = members.map((list) => {
        const cum = new Float64Array(list.length);
        let s = 0;
        for (let k = 0; k < list.length; k++) {
          s += weight[list[k]];
          cum[k] = s;
        }
        return cum;
      });

      const target = Math.round((n * MEAN_DEGREE) / 2);
      const seen = new Set();
      const src = new Uint32Array(target);
      const dst = new Uint32Array(target);
      let m = 0;
      while (m < target) {
        const u = sampleIndex(cumAll, rnd);
        const c = cluster[u];
        const v = rnd() < INTRA_SHARE
          ? members[c][sampleIndex(cumCluster[c], rnd)]
          : sampleIndex(cumAll, rnd);
        if (u === v) continue;
        const a = Math.min(u, v);
        const b = Math.max(u, v);
        const key = a * n + b;
        if (seen.has(key)) continue;
        seen.add(key);
        src[m] = a;
        dst[m] = b;
        m++;
      }

      const degree = new Uint32Array(n);
      for (let e = 0; e < m; e++) {
        degree[src[e]]++;
        degree[dst[e]]++;
      }
      return {n, m, cluster, x, y, degree, src, dst};
    }

    const PALETTE = Array.from({length: CLUSTERS}, (_, c) =>
      "#" + (((c + 1) * 2654435761) >>> 0 & 0xffffff).toString(16).padStart(6, "0"));

    // Graph data is "loaded" once the graphology object is built from the arrays.
    function buildGraph(d) {
      const graph = new Graph({type: "undirected"});
      for (let i = 0; i < d.n; i++) {
        graph.addNode(String(i), {
          x: d.x[i],
          y: d.y[i],
          size: Math.min(14, 1 + 1.6 * Math.sqrt(d.degree[i])),
          color: PALETTE[d.cluster[i]],
          label: `Node ${i}`
        });
      }
      for (let e = 0; e < d.m; e++) graph.addEdge(String(d.src[e]), String(d.dst[e]));
      return graph;
    }

    const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve(performance.now())));

    async function waitFor(predicate, timeoutMs) {
      const start = performance.now();
      while (!predicate()) {
        if (performance.now() - start > timeoutMs) return false;
        await nextFrame();
      }
      return true;
    }

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function percentile(sorted, p) {
      if (sorted.length === 0) return null;
      const idx = Math.min(sorted.length - 1, Math.floor(p * sorted.length));
      return sorted[idx];
    }

    function webglInfo() {
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
      if (!gl) return {available: false};
      const dbg = gl.getExtension("WEBGL_debug_renderer_info");
      return {
        available: true,
        version: gl.getParameter(gl.VERSION),
        renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)
      };
    }

    async function run({n, seed, durationMs}) {
      const stage = document.getElementById("stage");
      stage.replaceChildren();

      const genStart = performance.now();
      const data = makeSyntheticGraph(n, seed);
      const genMs = performance.now() - genStart;

      // t0: graph data is in memory. Everything below counts toward time to interactive.
      const t0 = performance.now();
      const graph = buildGraph(data);
      const buildMs = performance.now() - t0;

      // The sigma constructor draws the first frame synchronously (before any listener
      // can be attached), so that draw is inside sigma_init_ms. The first presented
      // frame is the next animation frame.
      const renderer = new Sigma(graph, stage, SIGMA_SETTINGS);
      const initMs = performance.now() - t0 - buildMs;
      const renders = [];
      renderer.on("afterRender", () => renders.push(performance.now()));
      await nextFrame();
      const tFirst = performance.now();

      // Interaction check: a real wheel event on sigma's mouse layer must trigger a new frame.
      const camera = renderer.getCamera();
      const ratioBefore = camera.getState().ratio;
      const rendersBefore = renders.length;
      renderer.getCanvases().mouse.dispatchEvent(new WheelEvent("wheel", {
        deltaY: -120,
        clientX: window.innerWidth / 2,
        clientY: window.innerHeight / 2,
        bubbles: true,
        cancelable: true
      }));
      const interactionOk = await waitFor(() => renders.length > rendersBefore, 2000);
      await nextFrame();
      const tReady = performance.now();
      const zoomChanged = interactionOk ? camera.getState().ratio !== ratioBefore : null;

      // Let any wheel animation finish, then reset to the start pose of the scripted path.
      await sleep(700);
      camera.setState({x: 0.5, y: 0.5, ratio: PATH_RATIO_CENTRE, angle: 0});
      await nextFrame();
      await nextFrame();

      // Scripted pan and zoom: one camera update per animation frame.
      const pathFirst = renders.length;
      const pathStart = performance.now();
      for (;;) {
        const now = await nextFrame();
        const s = Math.min(1, (now - pathStart) / durationMs);
        const ph = 2 * Math.PI * s;
        camera.setState({
          x: 0.5 + 0.25 * Math.sin(ph),
          y: 0.5 + 0.25 * Math.cos(ph),
          ratio: PATH_RATIO_CENTRE + 0.8 * Math.sin(2 * ph),
          angle: 0
        });
        if (s >= 1) break;
      }
      await nextFrame();
      const pathEnd = performance.now();
      const stamps = renders.slice(pathFirst).filter((t) => t >= pathStart && t <= pathEnd);
      const intervals = [];
      for (let i = 1; i < stamps.length; i++) intervals.push(stamps[i] - stamps[i - 1]);
      intervals.sort((a, b) => a - b);

      const pathSeconds = (pathEnd - pathStart) / 1000;
      const heap = performance.memory ? performance.memory.usedJSHeapSize / 1048576 : null;
      const out = {
        n,
        m: data.m,
        seed,
        gen_ms: genMs,
        build_ms: buildMs,
        sigma_init_ms: initMs,
        first_frame_ms: tFirst - t0,
        interaction_ok: interactionOk,
        zoom_changed_on_wheel: zoomChanged,
        tti_ms: interactionOk ? tReady - t0 : null,
        path_frames: stamps.length,
        path_seconds: pathSeconds,
        fps: stamps.length / pathSeconds,
        frame_ms_median: intervals.length ? percentile(intervals, 0.5) : null,
        frame_ms_p95: intervals.length ? percentile(intervals, 0.95) : null,
        js_heap_mb: heap,
        webgl: webglInfo(),
        viewport: {w: window.innerWidth, h: window.innerHeight, dpr: window.devicePixelRatio}
      };
      renderer.kill();
      stage.replaceChildren();
      return out;
    }

    window.benchApi = {run, libraries: {sigma: "3.0.3", graphology: "0.26.0"}};
  </script>
</body>
</html>
