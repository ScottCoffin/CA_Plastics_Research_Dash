name: Weekly future source watch

on:
  schedule:
    - cron: "31 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-source-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install fixture test runner
        run: python -m pip install -c requirements/lock.txt pytest
      - name: Run fixture checks
        run: python -m pytest tests/test_source_watch_s7_6.py -q
      - name: Check public source metadata
        env:
          PYTHONPATH: src
        run: python scripts/check_source_watch_s7_6.py
      - name: Watch CEDEN microplastics availability
        env:
          PYTHONPATH: src
        run: python scripts/watch_ceden_microplastics.py
      - name: Explain disabled commit guard
        if: vars.ENABLE_DATA_COMMITS != 'true'
        run: echo "ENABLE_DATA_COMMITS is not true; checked outputs remain in this workflow run."
      - name: Commit allowlisted checked outputs
        if: vars.ENABLE_DATA_COMMITS == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/SOURCES.md docs/api_notes/source_watch_s7_6.json docs/api_notes/ceden_watch.json
          git diff --cached --quiet && echo "No checked-source changes" && exit 0
          git commit -m "chore: update future source watch"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
