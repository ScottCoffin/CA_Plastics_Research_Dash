name: Keep scheduled workflows active

on:
  schedule:
    - cron: "42 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-data-commits
  cancel-in-progress: false

jobs:
  keepalive:
    name: Record repository activity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Explain disabled commit guard
        if: vars.ENABLE_DATA_COMMITS != 'true'
        run: echo "ENABLE_DATA_COMMITS is not true; no keepalive commit will be made."

      - name: Check out the default branch
        if: vars.ENABLE_DATA_COMMITS == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Commit keepalive timestamp
        if: vars.ENABLE_DATA_COMMITS == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git diff --cached --quiet && exit 0
          git commit -m "chore: keep scheduled workflows active"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
