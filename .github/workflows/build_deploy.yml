name: Build and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      spk1_parquet:
        description: "SPK-1 only: add synthetic 5/25/100 MB Parquet + probe page under /spikes/spk1/"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # SPK-1 hosting spike (owner-authorized 2026-11-09). Opt-in on manual
      # dispatch only; files exist only in this artifact and disappear on the
      # next normal deploy.
      - name: Add SPK-1 synthetic Parquet (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.spk1_parquet }}
        run: |
          python -m pip install --quiet "pyarrow==17.0.0"
          python spikes/spk1_hosting/make_parquet.py site/spikes/spk1
          cp spikes/spk1_hosting/probe.html site/spikes/spk1/probe.html

      # S8.9 open funding calls. A failed fetch defers (keeps the last JSON) and never fails the build.
      - name: Refresh open funding calls
        continue-on-error: true
        run: |
          python -m pip install --quiet -c requirements/lock.txt -e .
          python scripts/build_open_calls.py

      # S10.1 status page. Best effort: a failed Actions-runs request is recorded in the JSON, never fails the build.
      - name: Build status page
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet -c requirements/lock.txt -e .
          python scripts/build_status_page.py

      # S11.4 digest feed (site/feed.xml). Best effort: a failure keeps the committed fallback and never fails the build.
      - name: Build digest feed
        continue-on-error: true
        run: |
          python -m pip install --quiet -c requirements/lock.txt -e .
          python scripts/build_feed.py

      # S3.8 static expert and institution pages plus sitemaps (deploy-only, gitignored). Best
      # effort: a failure leaves this deploy without the SEO pages and never fails the build.
      - name: Build SEO pages
        continue-on-error: true
        run: |
          python -m pip install --quiet -c requirements/lock.txt -e .
          python scripts/build_seo_pages.py --site site
          python scripts/check_s3_8.py --site site

      # AT-5 Observable Framework app. Since the owner's H16 switch (2026-11-13) it is the site
      # root. Best effort: a failed build or check leaves this deploy with the classic site as
      # the root, so the site never goes down because of the app build.
      - name: Build Framework app
        id: framework
        continue-on-error: true
        working-directory: framework
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python ../scripts/check_at5.py --dist dist
          # UX-3: no internal project vocabulary in rendered public text.
          python ../scripts/check_public_text.py

      # Framework at the root over the classic site; /app/, grants.html, sem.html, expert.html
      # and classic #tab links become redirects (scripts/assemble_site.py).
      - name: Put Framework app at the site root
        if: ${{ steps.framework.outcome == 'success' }}
        run: python scripts/assemble_site.py --site site --dist framework/dist --out site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
