name: Build and deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      spk1_parquet:
        description: "SPK-1 only: add synthetic 5/25/100 MB Parquet + probe page under /spikes/spk1/"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # SPK-1 hosting spike (owner-authorized 2026-11-09). Opt-in on manual
      # dispatch only; files exist only in this artifact and disappear on the
      # next normal deploy.
      - name: Add SPK-1 synthetic Parquet (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.spk1_parquet }}
        run: |
          python -m pip install --quiet "pyarrow==17.0.0"
          python spikes/spk1_hosting/make_parquet.py site/spikes/spk1
          cp spikes/spk1_hosting/probe.html site/spikes/spk1/probe.html

      # S8.9 open funding calls. A failed fetch defers (keeps the last JSON) and never fails the build.
      - name: Refresh open funding calls
        continue-on-error: true
        run: |
          python -m pip install --quiet -c requirements/lock.txt -e .
          python scripts/build_open_calls.py

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
