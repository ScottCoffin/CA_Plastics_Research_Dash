name: Weekly collaboration null model

# 2026-11-25 (owner: wire the builds into the scheduled jobs). The daily ingest rebuilds
# site/data/california/network_metrics.json with --reuse-null (its 30-minute limit cannot fit the
# null model); this weekly job recomputes the degree-preserving null block (BQ-3.3, R=100, about
# 17 minutes on a laptop) from the committed site data. No API calls.

on:
  schedule:
    - cron: "41 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas-data-commits
  cancel-in-progress: false

jobs:
  null-model:
    name: Recompute the network null model
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lock.txt

      - name: Install package
        run: python -m pip install -c requirements/lock.txt -e ".[dev]"

      - name: Rebuild network metrics with the null model
        run: |
          python scripts/build_network_metrics.py
          python scripts/build_network_metrics.py --check

      - name: Commit the refreshed metrics
        if: vars.ENABLE_DATA_COMMITS == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/california/network_metrics.json
          git diff --cached --quiet && echo "No metric changes" && exit 0
          git commit -m "chore: weekly collaboration null model"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          gh workflow run build_deploy.yml --ref "$DEFAULT_BRANCH"
