name: Weekly BFFP roster refresh

on:
  schedule:
    - cron: "43 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas-data-commits
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh BFFP roster and group data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lock.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install -c requirements/lock.txt PyYAML playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Refresh and verify the roster
        run: |
          python scripts/build_groups_roster.py --fetch --incremental
          python scripts/build_groups_roster.py --check --incremental

      - name: Rebuild and verify derived group data
        run: |
          python scripts/build_groups.py
          python scripts/build_groups.py --check

      - name: Report disabled publication
        if: vars.ENABLE_DATA_COMMITS != 'true'
        run: echo "ENABLE_DATA_COMMITS is disabled. The checked data stays in this workflow run."

      - name: Commit the refreshed data
        if: vars.ENABLE_DATA_COMMITS == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          paths=(
            site/data/global/groups/roster.json
            site/data/global/groups/roster_manifest.json
            site/data/global/groups/groups.json
            site/data/global/groups/groups_tree.json
            site/data/global/groups/groups_graph.json
            site/data/global/groups/coverage.json
            site/data/global/groups/flows.json
            site/data/global/groups/precision_card.json
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --exit-code -- curation/
          git add -- "${paths[@]}"
          git diff --cached --quiet && echo "No roster or group data changes" && exit 0
          git commit -m "chore: weekly BFFP roster refresh"
          # Push directly. A concurrent default-branch commit makes this non-fast-forward and fails
          # closed; do not rebase a generated snapshot onto inputs it did not build against.
          git push origin "HEAD:$DEFAULT_BRANCH"
          gh workflow run build_deploy.yml --ref "$DEFAULT_BRANCH"
