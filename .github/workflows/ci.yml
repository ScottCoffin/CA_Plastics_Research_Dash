name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check Markdown links
        run: python scripts/check_doc_links.py

      - name: Check Add-on A1 scaffold
        run: python scripts/check_a1_scaffold.py

      - name: Check Add-on A2 scaffold
        run: python scripts/check_a2_scaffold.py

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build
