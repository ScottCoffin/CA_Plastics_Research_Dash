name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lock.txt

      - name: Check Markdown links
        run: python scripts/check_doc_links.py

      - name: Check Add-on A1 scaffold
        run: python scripts/check_a1_scaffold.py

      - name: Check Add-on A2 scaffold
        run: python scripts/check_a2_scaffold.py

      # ADR-FRAMEWORK-REVISIT-2026-11-11: warns (never fails) when a trigger to revisit
      # the deferred Observable Framework migration (AT-5/AT-6) has fired.
      - name: Check Observable Framework revisit triggers
        run: python scripts/check_framework_triggers.py

      - name: Install development dependencies
        run: python -m pip install -c requirements/lock.txt -e ".[dev]"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      # AT-4: committed serving bundle stays within the 3 MB gz landing budget, has no
      # abstracts, and facets.js counts match the Python reference (needs node).
      - name: Check serving bundle (AT-4)
        run: python scripts/check_at4.py

      # AT-5: Framework shell guardrails (pin, no external fonts/CDNs, top-level pages,
      # data files named by pages exist). Static; the build itself runs in build_deploy.yml.
      - name: Check Framework shell (AT-5)
        run: python scripts/check_at5.py

      # UX-3: no internal project vocabulary in public page text and site JSON (static;
      # build_deploy.yml repeats it on the built Framework pages).
      - name: Check public text (UX-3)
        run: python scripts/check_public_text.py

      # AT-11: committed site payload sizes and index schema.
      - name: Check site payload guards (AT-11)
        run: python scripts/check_ci_guards.py
