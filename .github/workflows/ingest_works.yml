name: Daily works ingestion

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Optional first publication year for a bounded bootstrap"
        required: false
        type: string
      end_year:
        description: "Optional last publication year for a bounded bootstrap"
        required: false
        type: string
      max_credits:
        description: "Optional credit ceiling for a safe manual smoke run"
        required: false
        type: string
      max_cost_usd:
        description: "Optional USD ceiling for a safe manual smoke run"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: atlas-data-commits
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch, normalize, and label works
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.refresh.outputs.status }}
      reason: ${{ steps.refresh.outputs.reason }}
    steps:
      - name: Record job start (S10.1 spend window)
        run: echo "JOB_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lock.txt

      - name: Install package
        run: python -m pip install -c requirements/lock.txt -e ".[dev]"

      - name: Refresh OpenAlex works
        id: refresh
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          OPENALEX_MAX_CREDITS: ${{ inputs.max_credits || vars.OPENALEX_MAX_CREDITS }}
          OPENALEX_MAX_COST_USD: ${{ inputs.max_cost_usd || vars.OPENALEX_MAX_COST_USD }}
        run: |
          set -euo pipefail
          args=(--allow-candidate)
          if [[ -n "${START_YEAR:-}" ]]; then args+=(--start-year "$START_YEAR"); fi
          if [[ -n "${END_YEAR:-}" ]]; then args+=(--end-year "$END_YEAR"); fi
          if [[ -n "${OPENALEX_MAX_CREDITS:-}" ]]; then args+=(--max-credits "$OPENALEX_MAX_CREDITS"); fi
          if [[ -n "${OPENALEX_MAX_COST_USD:-}" ]]; then args+=(--max-cost-usd "$OPENALEX_MAX_COST_USD"); fi
          python scripts/run_daily_works.py "${args[@]}"

      - name: Normalize works
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/normalize_openalex.py

      - name: Label works
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/label_works.py

      # S10.1 run history. Placed after label so counts reflect this run; always runs so failures are recorded.
      - name: Record run status
        if: always()
        continue-on-error: true
        env:
          REFRESH_STATUS: ${{ steps.refresh.outputs.status }}
        run: |
          case "${REFRESH_STATUS:-}" in
            success) status=ok ;;
            deferred) status=deferred ;;
            *) status=failed ;;
          esac
          python scripts/record_run_status.py --workflow ingest_works --run-id "${{ github.run_id }}" --status "$status" --since "$JOB_STARTED_UTC"

      - name: Explain disabled commit guard
        if: steps.refresh.outputs.status == 'success' && vars.ENABLE_DATA_COMMITS != 'true'
        run: echo "ENABLE_DATA_COMMITS is not true; generated outputs remain local to this run."

      - name: Commit generated outputs
        if: steps.refresh.outputs.status == 'success' && vars.ENABLE_DATA_COMMITS == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/interim/works_raw.parquet \
            data/interim/openalex_works_high_water_mark.json \
            data/processed/normalized/*.parquet \
            data/processed/work_labels.parquet \
            data/processed/status_history.jsonl \
            docs/normalization_qc.md \
            docs/labels_qc.md
          git diff --cached --quiet && echo "No generated output changes" && exit 0
          git commit -m "chore: refresh OpenAlex works data"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
