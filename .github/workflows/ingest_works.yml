name: Daily works ingestion

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Optional first publication year for a bounded bootstrap"
        required: false
        type: string
      end_year:
        description: "Optional last publication year for a bounded bootstrap"
        required: false
        type: string
      max_credits:
        description: "Optional credit ceiling for a safe manual smoke run"
        required: false
        type: string
      max_cost_usd:
        description: "Optional USD ceiling for a safe manual smoke run"
        required: false
        type: string

permissions:
  contents: write
  actions: write
  # The failure alert opens, comments on and closes the "Daily ingest failing" issue.
  issues: write

concurrency:
  group: atlas-data-commits
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch, normalize, and label works
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.refresh.outputs.status }}
      reason: ${{ steps.refresh.outputs.reason }}
    steps:
      - name: Record job start (S10.1 spend window)
        run: echo "JOB_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lock.txt

      - name: Install package
        run: python -m pip install -c requirements/lock.txt -e ".[dev]"

      - name: Refresh OpenAlex works
        id: refresh
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_KEY_ALT: ${{ secrets.OPENALEX_API_KEY_ALT }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          OPENALEX_MAX_CREDITS: ${{ inputs.max_credits || vars.OPENALEX_MAX_CREDITS }}
          OPENALEX_MAX_COST_USD: ${{ inputs.max_cost_usd || vars.OPENALEX_MAX_COST_USD }}
        run: |
          set -euo pipefail
          args=(--failure-note "$RUNNER_TEMP/ingest_failure.txt")
          if [[ -n "${START_YEAR:-}" ]]; then args+=(--start-year "$START_YEAR"); fi
          if [[ -n "${END_YEAR:-}" ]]; then args+=(--end-year "$END_YEAR"); fi
          if [[ -n "${OPENALEX_MAX_CREDITS:-}" ]]; then args+=(--max-credits "$OPENALEX_MAX_CREDITS"); fi
          if [[ -n "${OPENALEX_MAX_COST_USD:-}" ]]; then args+=(--max-cost-usd "$OPENALEX_MAX_COST_USD"); fi
          # Weekly deep sweep: on Sundays (UTC) the incremental lookback is 180 days, not 30.
          if [[ "$(date -u +%u)" == "7" ]]; then args+=(--deep-sweep); fi
          python scripts/run_daily_works.py "${args[@]}"

      - name: Normalize works
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/normalize_openalex.py

      - name: Label works
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/label_works.py

      # Owner rules: AT-1 audit labels -> overrides; same name + institution -> author merges.
      - name: Build curation from owner rules
        if: steps.refresh.outputs.status == 'success'
        run: |
          python scripts/build_audit_overrides.py
          python scripts/build_author_merges.py
          python scripts/build_institution_types.py

      # Career citations / h-index for the Experts sort (~20 list credits; keeps the old
      # file on a budget or rate stop).
      - name: Fetch author metrics
        if: steps.refresh.outputs.status == 'success'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_KEY_ALT: ${{ secrets.OPENALEX_API_KEY_ALT }}
        run: python scripts/fetch_author_metrics.py

      # Experts/Institutions payloads for the live site (CA-affiliated experts only).
      - name: Export site data
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/build_export_site.py

      # AT-3 analytics (DuckDB) over the published works, then the AT-4 serving bundle.
      - name: Build analytics and serving bundle
        if: steps.refresh.outputs.status == 'success'
        run: |
          python scripts/build_analytics.py
          python scripts/build_bundle.py
          python scripts/check_at4.py

      # S9.4 collaboration network (networkx, seeded Louvain + spring layout) from the new export.
      - name: Build collaboration network
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/build_network.py

      # VD-19 header search: one index over pages, experts, institutions, topics, funders,
      # glossary terms and related resources (stdlib only; reads the files built above).
      - name: Build site search index
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/build_search_index.py

      # S9.3 funding and data-stewardship badges for the expert profile page.
      - name: Build expert badges
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/build_expert_badges.py

      # 2026-11-17: records derived from the exported site data. Institution types read the
      # export, so they rebuild here too (the earlier run is one day behind otherwise). Journal
      # metrics fetch only new journals' OpenAlex sources (~30 list credits at most); a budget
      # or network stop keeps yesterday's file, whose missing journals show no value.
      - name: Refresh export-derived records
        if: steps.refresh.outputs.status == 'success'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_KEY_ALT: ${{ secrets.OPENALEX_API_KEY_ALT }}
        run: |
          python scripts/build_institution_types.py
          python scripts/fetch_journal_metrics.py || echo "::warning::journal metrics not refreshed; keeping the committed file"
          # PLAT-2 landing: global country counts (cached 7 days, ~40 credits per refresh) and the
          # world raster built from them. A failure keeps yesterday's files.
          if python scripts/build_global_counts.py; then
            python scripts/build_landing_assets.py --raster-only
          else
            echo "::warning::global country counts not refreshed; keeping the committed files"
          fi
          # GA-2 /explore: real OpenAlex samples (cached 7 days, ~350 credits per refresh) and the
          # per-country map/count file built from them. A failure keeps yesterday's files.
          python scripts/fetch_global_explore_sample.py || echo "::warning::explore sample not refreshed; keeping the committed file"
          python scripts/build_global_explore.py || echo "::warning::explore.json not rebuilt; keeping the committed file"
          # PLAT-2b landing evidence grid: 30 count queries (~300 credits, daily cache). A failure keeps yesterday's file.
          python scripts/fetch_evidence_cells.py || echo "::warning::evidence cells not refreshed; keeping the committed file"

      # AT-11: stop before committing if the raw/normalized schema changed or a payload is too big.
      - name: Schema and payload guards
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/check_ci_guards.py --require-raw --require-normalized

      # S10.1 run history. Placed after label so counts reflect this run; always runs so failures are recorded.
      - name: Record run status
        if: always()
        continue-on-error: true
        env:
          REFRESH_STATUS: ${{ steps.refresh.outputs.status }}
        run: |
          case "${REFRESH_STATUS:-}" in
            success) status=ok ;;
            deferred) status=deferred ;;
            *) status=failed ;;
          esac
          python scripts/record_run_status.py --workflow ingest_works --run-id "${{ github.run_id }}" --status "$status" --since "$JOB_STARTED_UTC"

      # 2026-11-17 failure alert. A failed refresh on a scheduled or manual run opens, or comments
      # on, one "Daily ingest failing" issue. Deferred (budget/429) runs stay quiet. The diagnostic
      # is the redacted note from run_daily_works.py; no key is printed or written to the issue.
      - name: Alert on failed refresh
        if: >-
          always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.refresh.outputs.status != 'success' && steps.refresh.outputs.status != 'deferred'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTE_FILE: ${{ runner.temp }}/ingest_failure.txt
        run: |
          today=$(date -u +%F)
          body="$RUNNER_TEMP/ingest_alert_body.md"
          {
            echo "The daily OpenAlex works refresh failed on $today."
            echo
            echo "Run: $RUN_URL"
            echo
            echo "Redacted diagnostics:"
            echo
            echo '```text'
            if [[ -s "$NOTE_FILE" ]]; then head -c 2000 "$NOTE_FILE"; else echo "No failure note was written; see the run log."; fi
            echo '```'
            echo
            echo "The next successful run comments and closes this issue. The high-water mark did not advance, so the missed window is re-read."
          } > "$body"
          gh label create ingest-alert --color B60205 --description "Daily OpenAlex ingest failed" --force
          number=$(gh issue list --label ingest-alert --state open --json number,title --jq '[.[] | select(.title == "Daily ingest failing")][0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "Daily ingest failing" --label ingest-alert --body-file "$body"
          fi

      # The next successful refresh comments "Recovered on <date>" and closes any open alert issue.
      - name: Close the ingest alert after a successful refresh
        if: success() && steps.refresh.outputs.status == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          today=$(date -u +%F)
          for number in $(gh issue list --label ingest-alert --state open --json number,title --jq '.[] | select(.title == "Daily ingest failing") | .number'); do
            gh issue comment "$number" --body "Recovered on $today."
            gh issue close "$number"
          done

      - name: Explain disabled commit guard
        if: steps.refresh.outputs.status == 'success' && vars.ENABLE_DATA_COMMITS != 'true'
        run: echo "ENABLE_DATA_COMMITS is not true; generated outputs remain local to this run."

      - name: Commit generated outputs
        if: steps.refresh.outputs.status == 'success' && vars.ENABLE_DATA_COMMITS == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/interim/works_raw.parquet \
            data/interim/openalex_works_high_water_mark.json \
            data/processed/normalized/*.parquet \
            data/processed/work_labels.parquet \
            data/processed/author_metrics.parquet \
            curation/overrides_works.csv \
            curation/author_merges.csv \
            config/institution_types.csv \
            data/processed/institution_review_needs_v31.csv \
            docs/AT_2_VERIFICATION.md \
            data/processed/status_history.jsonl \
            docs/normalization_qc.md \
            docs/labels_qc.md \
            site/data/california/index.json \
            site/data/california/aggregates.json \
            site/data/california/build_metadata.json \
            site/data/california/institutions.json \
            site/data/california/institutions.geojson \
            site/data/california/works_detail.json \
            site/data/california/network.json \
            site/data/california/search_index.json \
            site/data/california/expert_badges.json \
            site/data/california/journal_metrics.json \
            site/data/global/global_counts.json \
            site/data/global/world_raster.json             site/data/global/explore_sample.json             site/data/global/explore.json site/data/global/evidence_cells.json
          git add -A site/data/california/authors site/data/california/institution_works site/data/california/bundle site/data/california/work_text
          git diff --cached --quiet && echo "No generated output changes" && exit 0
          git commit -m "chore: refresh OpenAlex works data"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          # A GITHUB_TOKEN push does not trigger other workflows; dispatch the deploy.
          gh workflow run build_deploy.yml --ref "$DEFAULT_BRANCH"

      # NOTIFY-AB: one ntfy alert when this run committed new plastic-related works. The baseline is the
      # works file at the checkout commit (github.sha), i.e. before this run. Never fails the run.
      - name: Notify new California plastics papers (ntfy)
        if: steps.refresh.outputs.status == 'success' && vars.ENABLE_DATA_COMMITS == 'true'
        continue-on-error: true
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$RUN_SHA" ]]; then
            echo "No data commit from this run; no ntfy alert."
            exit 0
          fi
          before="$RUNNER_TEMP/works_detail_before.json"
          if ! git show "$RUN_SHA:site/data/california/works_detail.json" > "$before"; then
            echo "::warning::works_detail.json at the checkout commit not found; no ntfy alert."
            exit 0
          fi
          python scripts/notify_ntfy.py --previous "$before"
