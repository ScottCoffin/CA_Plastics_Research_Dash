name: Daily works ingestion

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      start_year:
        description: "Optional first publication year for a bounded bootstrap"
        required: false
        type: string
      end_year:
        description: "Optional last publication year for a bounded bootstrap"
        required: false
        type: string
      max_credits:
        description: "Optional credit ceiling for a safe manual smoke run"
        required: false
        type: string
      max_cost_usd:
        description: "Optional USD ceiling for a safe manual smoke run"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: atlas-data-commits
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch, normalize, and label works
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.refresh.outputs.status }}
      reason: ${{ steps.refresh.outputs.reason }}
    steps:
      - name: Record job start (S10.1 spend window)
        run: echo "JOB_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lock.txt

      - name: Install package
        run: python -m pip install -c requirements/lock.txt -e ".[dev]"

      - name: Refresh OpenAlex works
        id: refresh
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_KEY_ALT: ${{ secrets.OPENALEX_API_KEY_ALT }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          OPENALEX_MAX_CREDITS: ${{ inputs.max_credits || vars.OPENALEX_MAX_CREDITS }}
          OPENALEX_MAX_COST_USD: ${{ inputs.max_cost_usd || vars.OPENALEX_MAX_COST_USD }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${START_YEAR:-}" ]]; then args+=(--start-year "$START_YEAR"); fi
          if [[ -n "${END_YEAR:-}" ]]; then args+=(--end-year "$END_YEAR"); fi
          if [[ -n "${OPENALEX_MAX_CREDITS:-}" ]]; then args+=(--max-credits "$OPENALEX_MAX_CREDITS"); fi
          if [[ -n "${OPENALEX_MAX_COST_USD:-}" ]]; then args+=(--max-cost-usd "$OPENALEX_MAX_COST_USD"); fi
          python scripts/run_daily_works.py "${args[@]}"

      - name: Normalize works
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/normalize_openalex.py

      - name: Label works
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/label_works.py

      # Owner rules: AT-1 audit labels -> overrides; same name + institution -> author merges.
      - name: Build curation from owner rules
        if: steps.refresh.outputs.status == 'success'
        run: |
          python scripts/build_audit_overrides.py
          python scripts/build_author_merges.py
          python scripts/build_institution_types.py

      # Career citations / h-index for the Experts sort (~20 list credits; keeps the old
      # file on a budget or rate stop).
      - name: Fetch author metrics
        if: steps.refresh.outputs.status == 'success'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_API_KEY_ALT: ${{ secrets.OPENALEX_API_KEY_ALT }}
        run: python scripts/fetch_author_metrics.py

      # Experts/Institutions payloads for the live site (CA-affiliated experts only).
      - name: Export site data
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/build_export_site.py

      # AT-3 analytics (DuckDB) over the published works, then the AT-4 serving bundle.
      - name: Build analytics and serving bundle
        if: steps.refresh.outputs.status == 'success'
        run: |
          python scripts/build_analytics.py
          python scripts/build_bundle.py
          python scripts/check_at4.py

      # S9.4 collaboration network (networkx, seeded Louvain + spring layout) from the new export.
      - name: Build collaboration network
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/build_network.py

      # S9.3 funding and data-stewardship badges for the expert profile page.
      - name: Build expert badges
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/build_expert_badges.py

      # AT-11: stop before committing if the raw/normalized schema changed or a payload is too big.
      - name: Schema and payload guards
        if: steps.refresh.outputs.status == 'success'
        run: python scripts/check_ci_guards.py --require-raw --require-normalized

      # S10.1 run history. Placed after label so counts reflect this run; always runs so failures are recorded.
      - name: Record run status
        if: always()
        continue-on-error: true
        env:
          REFRESH_STATUS: ${{ steps.refresh.outputs.status }}
        run: |
          case "${REFRESH_STATUS:-}" in
            success) status=ok ;;
            deferred) status=deferred ;;
            *) status=failed ;;
          esac
          python scripts/record_run_status.py --workflow ingest_works --run-id "${{ github.run_id }}" --status "$status" --since "$JOB_STARTED_UTC"

      - name: Explain disabled commit guard
        if: steps.refresh.outputs.status == 'success' && vars.ENABLE_DATA_COMMITS != 'true'
        run: echo "ENABLE_DATA_COMMITS is not true; generated outputs remain local to this run."

      - name: Commit generated outputs
        if: steps.refresh.outputs.status == 'success' && vars.ENABLE_DATA_COMMITS == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            data/interim/works_raw.parquet \
            data/interim/openalex_works_high_water_mark.json \
            data/processed/normalized/*.parquet \
            data/processed/work_labels.parquet \
            data/processed/author_metrics.parquet \
            curation/overrides_works.csv \
            curation/author_merges.csv \
            config/institution_types.csv \
            data/processed/institution_review_needs_v31.csv \
            docs/AT_2_VERIFICATION.md \
            data/processed/status_history.jsonl \
            docs/normalization_qc.md \
            docs/labels_qc.md \
            site/data/index.json \
            site/data/aggregates.json \
            site/data/build_metadata.json \
            site/data/institutions.json \
            site/data/institutions.geojson \
            site/data/works_detail.json \
            site/data/network.json \
            site/data/expert_badges.json
          git add -A site/data/authors site/data/institution_works site/data/bundle site/data/work_text
          git diff --cached --quiet && echo "No generated output changes" && exit 0
          git commit -m "chore: refresh OpenAlex works data"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
          # A GITHUB_TOKEN push does not trigger other workflows; dispatch the deploy.
          gh workflow run build_deploy.yml --ref "$DEFAULT_BRANCH"
